name: Update H5N1 data

# Every 6 hours, updates the case and wastewater data in src/assets/data and, if it changed, opens a pull request.
# The case update runs Claude Code and needs the CLAUDE_CODE_OAUTH_TOKEN secret.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  LABEL: h5n1-data-update # marks the pull requests this workflow opens

jobs:
  # Skip the update while a pull request from this workflow is open and under a week old; close older ones so a fresh one replaces them
  check:
    if: github.repository == 'outbreak-info/outbreak-info-h5n1'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to delete the closed pull request's branch
      pull-requests: write
    outputs:
      open-pr: ${{ steps.pr.outputs.number }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail # a failed lookup must not look like "no open pull request"
          gh pr list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --json number,createdAt \
            --jq '.[] | "\(.number) \(now - (.createdAt | fromdateiso8601) >= 7*24*3600)"' |
          while read -r pr stale; do
            if [ "$stale" = true ]; then
              gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch --comment "Closing because this is over a week old; a newer update replaces it."
            else
              echo "number=$pr" >> "$GITHUB_OUTPUT"
              echo "::notice::#$pr is still open, so skipping this run"
            fi
          done

  update:
    needs: check
    if: needs.check.outputs.open-pr == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: src/assets/data
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch wastewater data
        run: ./fetch_h5_wastewater.sh

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch case data
        run: ./fetch_h5n1_cases.sh

      - name: Open a pull request if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # retrieved_at changes on every run, so a change to it alone doesn't count
          if git diff --quiet -I '"retrieved_at"' h5n1_us_cases.json h5_wastewater.json; then echo "No changes"; exit 0; fi
          branch=h5n1-data-$(date +%Y-%m-%d-%H)
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m "chore: update H5N1 data" h5n1_us_cases.json h5_wastewater.json
          git push origin "$branch"
          gh pr create --base main --label "$LABEL" --title "Update H5N1 data" --body "Automated update of the H5N1 case and wastewater data"
